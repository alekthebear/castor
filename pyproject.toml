[project]
name = "castor"
version = "0.1.0"
description = "A forecasting bot for Metaculus powered by LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "forecasting-tools>=0.2.81",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=0.5.0",
    "asknews>=0.13.0",
    "langfuse>=3.0.0",
    "numpy>=1.24.0",
    # OpenTelemetry for Langfuse integration
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "openinference-instrumentation-openai>=0.1.0",
    "openinference-instrumentation-anthropic>=0.1.0",
    "openinference-instrumentation-google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
castor = "castor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
