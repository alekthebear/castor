name: Run Forecast

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'prod'
        type: environment
      mode:
        description: 'Forecast mode'
        required: true
        type: choice
        options:
          - question
          - tournament
      id:
        description: 'Question ID (int) or Tournament ID/slug'
        required: true
        type: string
      submit:
        description: 'Submit predictions to Metaculus'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force rerun even if previously forecasted'
        required: false
        type: boolean
        default: false
      agent:
        description: 'Agent that produces the forecast'
        required: false
        type: string
        default: 'baseline'
      num_samples:
        description: 'Number of Samples per question'
        required: false
        type: number
        default: 3

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run forecast
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CASTOR_ENV: dev
        run: |
          ARGS=""

          if [ "${{ inputs.mode }}" = "question" ]; then
            ARGS="--post ${{ inputs.id }}"
          else
            ARGS="--tournament ${{ inputs.id }}"
          fi

          if [ "${{ inputs.submit }}" = "true" ]; then
            ARGS="$ARGS --submit"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          ARGS="$ARGS --agent ${{ inputs.agent }} --num-samples ${{ inputs.num_samples }}"

          echo "Running: uv run castor $ARGS"
          uv run castor $ARGS
